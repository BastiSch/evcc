name: Generate .deb (amd64)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-deb:
    name: Build .deb (amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Install UI dependencies
        run: make install-ui

      - name: Build UI
        run: make ui

      - name: Build .deb with GoReleaser (amd64)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: '~> v2'
          args: --snapshot -f .goreleaser.yml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'

      - name: List release
        run: ls -l release || true

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: release/*.deb
